[package]
name = "rllm-cuda"
description = "CUDA backend: cudarc driver API, NVRTC-compiled kernels, cuBLAS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rllm-core.workspace = true
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "dynamic-loading", "cuda-13020", "f16"] }
half.workspace = true
libloading = "0.9"

[dev-dependencies]
half.workspace = true
rllm-cpu.workspace = true
