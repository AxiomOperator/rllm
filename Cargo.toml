[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rllm-gguf = { path = "crates/rllm-gguf" }
rllm-core = { path = "crates/rllm-core" }
rllm-cpu = { path = "crates/rllm-cpu" }
rllm-cuda = { path = "crates/rllm-cuda" }
rllm-hip = { path = "crates/rllm-hip" }
rllm-kv = { path = "crates/rllm-kv" }
rllm-model = { path = "crates/rllm-model" }
rllm-tokenizer = { path = "crates/rllm-tokenizer" }
rllm-server = { path = "crates/rllm-server" }

anyhow = "1"
thiserror = "2"
half = "2"
memmap2 = "0.9"
rayon = "1"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "2", features = ["loop_controls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
minijinja-contrib = { version = "2", features = ["pycompat"] }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
